[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "PIE", "RUF"]
ignore = [
    "E501",    # long lines are allowed (line-length is a formatting hint only)
    "RUF001",  # French text: typographic characters are intended
    "RUF002",
    "RUF003",
    "B008",    # FastAPI Depends()/Query() in defaults
    "E741",    # `l` for a harvest lot reads naturally in this domain
    "UP046",   # keep Generic[T] / TypeVar style (consistent with the codebase)
    "UP047",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pulp", "pulp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
