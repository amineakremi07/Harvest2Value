services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - NIM_API_KEY=${NIM_API_KEY}
      - NIM_ENDPOINT=${NIM_ENDPOINT:-https://api.nvidia.com/v1/llm/meta/llama-3.1-70b-instruct}
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev -- -p 5173
